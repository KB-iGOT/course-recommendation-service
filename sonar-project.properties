# Project identifiers
sonar.projectKey=course-recommendation-service
sonar.projectName=Course Recommendation Service
sonar.projectVersion=1.0

# Project source and test config
sonar.sources=.
sonar.tests=tests
sonar.language=py
sonar.sourceEncoding=UTF-8

# Coverage report path
sonar.python.coverage.reportPaths=coverage.xml

# Exclude virtual env and cache
sonar.exclusions=**/venv/**,**/__pycache__/**

# Optional: test file patterns
sonar.test.inclusions=**/test_*.py,**/*_test.py

sonar.issue.ignore.multicriteria=e1Add commentMore actions
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S5142
sonar.issue.ignore.multicriteria.e1.resourceKey=**/tests/**/*